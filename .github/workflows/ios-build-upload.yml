# ============================================================
#  GitHub Actions — 无需 Mac 构建 iOS App 并上传 App Store
#  公开仓库免费 (macos-latest runner)
#  私有仓库: macOS 分钟按 10x 计费，建议用 Codemagic 代替
# ============================================================

name: Build & Upload iOS

on:
  # 打 tag (如 v1.0.0) 时触发构建
  push:
    tags:
      - 'v*'
  # 手动触发
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
        run: |
          cd TimeTreehole
          # 用你的 Team ID 替换占位符
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$TEAM_ID\"/" project.yml
          xcodegen generate

      - name: 安装发布证书
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 创建临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -t 3600 build.keychain-db

          # 导入证书
          echo $BUILD_CERTIFICATE_BASE64 | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain-db -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db

      - name: 写入 App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo $API_KEY_BASE64 | base64 -d > ~/private_keys/AuthKey_$API_KEY_ID.p8

      - name: 编译归档
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd TimeTreehole
          xcodebuild archive \
            -project TimeTreehole.xcodeproj \
            -scheme TimeTreehole \
            -archivePath build/TimeTreehole.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$API_KEY_ID.p8 \
            -authenticationKeyID $API_KEY_ID \
            -authenticationKeyIssuerID $ISSUER_ID \
            | xcpretty

      - name: 导出 IPA
        env:
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM_ID }}
        run: |
          cd TimeTreehole
          # 生成 ExportOptions.plist
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/TimeTreehole.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            | xcpretty

      - name: 上传到 App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd TimeTreehole/build/ipa
          ls -la *.ipa
          xcrun altool --upload-app \
            --type ios \
            --file TimeTreehole.ipa \
            --apiKey $API_KEY_ID \
            --apiIssuer $ISSUER_ID

      - name: 上传构建产物 (备份)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TimeTreehole-build
          path: TimeTreehole/build/
          retention-days: 7
