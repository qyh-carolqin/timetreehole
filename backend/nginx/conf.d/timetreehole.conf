# ============================================================
#  时间树洞 · 站点配置
#  HTTPS 反向代理 → Express (localhost:3000)
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name api.timetreehole.com;

    # Let's Encrypt 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他所有请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站点
server {
    listen 443 ssl http2;
    server_name api.timetreehole.com;

    # ============================================================
    # SSL 证书（由 Certbot 自动管理）
    # ============================================================
    ssl_certificate     /etc/letsencrypt/live/api.timetreehole.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.timetreehole.com/privkey.pem;

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ============================================================
    # API 反向代理
    # ============================================================
    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 长连接支持
        proxy_set_header Connection "";
        proxy_buffering off;

        # 超时（音频上传可能需要较长时间）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # ============================================================
    # 健康检查端点（无需认证，不做任何限速）
    # ============================================================
    location /api/health {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 健康检查不记录日志
        access_log off;
    }

    # ============================================================
    # 音频文件（上传目录静态服务 + 缓存优化）
    # ============================================================
    location /uploads/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 音频缓存 7 天
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # 禁止访问隐藏文件
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
