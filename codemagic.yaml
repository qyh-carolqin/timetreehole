# ============================================================
#  Codemagic CI/CD 配置 — 时间树洞 iOS
#  使用 Fastlane 管理证书/描述文件/构建/上传
#  免费额度: 500 分钟/月
# ============================================================

workflows:
  ios-workflow:
    name: 时间树洞 iOS

    max_build_duration: 60
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      xcode: latest
      groups:
        - appstore_credentials

    scripts:
      - name: 安装依赖
        script: |
          brew install xcodegen
          gem install bundler
          bundle install

      - name: 生成 Xcode 工程
        script: |
          # 注意: xcodegen 的 --project 是“父目录”，它会自动追加 <name>.xcodeproj
          # (即 project.yml 里的 name: TimeTreehole)。传 TimeTreehole/TimeTreehole.xcodeproj
          # 会被当成目录再套一层导致嵌套失败。所以这里只传父目录 TimeTreehole。
          xcodegen generate --spec TimeTreehole/project.yml --project TimeTreehole

      - name: Fastlane 构建并上传 TestFlight
        script: |
          bundle exec fastlane ios beta

    artifacts:
      - build/TimeTreehole.ipa

    publishing:
      email:
        recipients:
          - 344833026@qq.com
        notify:
          success: true
          failure: true
