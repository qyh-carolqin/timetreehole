# ============================================================
#  Codemagic CI/CD 配置 — 时间树洞 iOS
#  使用 Fastlane 管理证书/描述文件/构建/上传
#  免费额度: 500 分钟/月
# ============================================================

workflows:
  ios-workflow:
    name: 时间树洞 iOS

    max_build_duration: 60
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      xcode: latest
      groups:
        - appstore_credentials

    scripts:
      - name: 安装依赖
        script: |
          brew install xcodegen
          gem install bundler
          bundle install

      - name: 生成 Xcode 工程
        script: |
          cd TimeTreehole
          xcodegen generate

      - name: 调试 - 检查签名变量是否注入
        script: |
          echo "KEY_ID=${APP_STORE_CONNECT_KEY_IDENTIFIER:-<未设置>}"
          echo "ISSUER=${APP_STORE_CONNECT_ISSUER_ID:-<未设置>}"
          echo "TEAM=${DEVELOPMENT_TEAM_ID:-<未设置>}"
          if [ -n "$APP_STORE_CONNECT_KEY" ]; then echo "APP_STORE_CONNECT_KEY=已设置"; else echo "APP_STORE_CONNECT_KEY=未设置"; fi

      - name: Fastlane 构建并上传 TestFlight
        script: |
          bundle exec fastlane ios beta

    artifacts:
      - build/TimeTreehole.ipa

    publishing:
      email:
        recipients:
          - 344833026@qq.com
        notify:
          success: true
          failure: true
