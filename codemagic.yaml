# ============================================================
#  Codemagic CI/CD 配置 — 时间树洞 iOS
#  使用 Codemagic 原生自动签名，无需手动管理证书/描述文件
#  免费额度: 500 分钟/月
# ============================================================

workflows:
  ios-workflow:
    name: 时间树洞 iOS

    max_build_duration: 60
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      xcode: latest
      groups:
        - appstore_credentials

    # ========== Codemagic 原生自动代码签名 ==========
    code_signing:
      automatic: true

    scripts:
      - name: 安装依赖
        script: |
          brew install xcodegen

      - name: 清理旧证书
        script: |
          cd scripts
          python3 revoke_certs.py

      - name: 生成 Xcode 工程
        script: |
          cd TimeTreehole
          xcodegen generate

      - name: 构建归档并导出 IPA
        script: |
          cd TimeTreehole
          xcode-project build-ipa \
            --project TimeTreehole.xcodeproj \
            --scheme TimeTreehole \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - 344833026@qq.com
        notify:
          success: true
          failure: true
