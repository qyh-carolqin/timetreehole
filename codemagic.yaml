# ============================================================
#  Codemagic CI/CD 配置 — 无需 Mac 也能构建上架
#  文档: https://docs.codemagic.io/yaml-code-signing/
#  免费额度: 500 分钟/月 (iOS 构建约 10 分钟/次，够用)
# ============================================================

workflows:
  ios-workflow:
    name: 时间树洞 iOS

    # 构建超时 (分钟)
    max_build_duration: 60

    # 免费层使用 Mac mini M1
    instance_type: mac_mini_m1

    # 触发条件: push 到 main 分支或打 tag
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      # Xcode 版本
      xcode: latest

      # 环境变量组 (在 Codemagic 网页后台填写)
      # Codemagic 会自动用这里的 App Store Connect API Key 创建证书和描述文件
      groups:
        - appstore_credentials

    scripts:
      - name: 安装 XcodeGen
        script: |
          brew install xcodegen

      - name: 生成 Xcode 工程
        script: |
          cd TimeTreehole
          echo "project.yml 中的 Team ID:"
          grep DEVELOPMENT_TEAM project.yml
          xcodegen generate

      - name: 编译并归档
        script: |
          cd TimeTreehole
          set -o pipefail
          xcodebuild archive \
            -project TimeTreehole.xcodeproj \
            -scheme TimeTreehole \
            -archivePath build/TimeTreehole.xcarchive \
            -destination "generic/platform=iOS" \
            -configuration Release
          echo "=== 归档文件列表 ==="
          ls -la build/

      - name: 导出 IPA
        script: |
          cd TimeTreehole
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>KANC5UYLGN</string>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/TimeTreehole.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist
          echo "=== IPA 文件列表 ==="
          ls -la build/ipa/

    artifacts:
      - TimeTreehole/build/ipa/*.ipa

    publishing:
      # 自动上传到 App Store Connect -> TestFlight
      # Codemagic 会使用 appstore_credentials 变量组自动处理签名
      app_store_connect:
        api_key: $APP_STORE_CONNECT_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

      # 构建结果邮件通知
      email:
        recipients:
          - 344833026@qq.com
        notify:
          success: true
          failure: true
